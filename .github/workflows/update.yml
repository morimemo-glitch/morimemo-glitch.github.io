name: 価格の更新とサイトの公開

on:
  schedule:
    - cron: "17 19 * * 0"   # 毎週月曜 4:17（日本時間）
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 楽天から価格を取得
        if: github.event_name != 'push' && env.RAKUTEN_APP_ID != ''
        run: python scripts/fetch_rakuten.py

      - name: 取得したデータを保存
        if: github.event_name != 'push' && env.RAKUTEN_APP_ID != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && git add data/
          git diff --cached --quiet || git commit -m "価格データを更新"
          git push

      - name: サイトを生成
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
